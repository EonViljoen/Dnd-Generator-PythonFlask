<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}D&D Prompt Helper{% endblock %}</title>
    <meta name="description" content="Random prompts for dungeon masters: encounters, NPCs, items, quests, towns and more. Roll one when the party goes off-script.">
    <meta name="theme-color" content="#15110e">
    <!-- Applies the saved theme before first paint (no flash) -->
    <script src="{{ url_for('static', filename='scripts/theme.js') }}"></script>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <!-- Installable app (see static/manifest.webmanifest) -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <meta name="apple-mobile-web-app-title" content="Prompt Helper">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Fonts, Bootstrap and icons are served with the site (static/vendor) so they work offline -->
    <link href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="{{ url_for('main.Home') }}">
          <i class="bi bi-dice-5" aria-hidden="true"></i>
          <span>D&amp;D Prompt Helper</span>
        </a>
        {% block header_extra %}{% endblock %}
      </div>
    </header>

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
    <script>
      // Keep a copy of the site so it opens instantly while the free server wakes up (see static/sw.js)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
    </script>
  </body>
</html>
