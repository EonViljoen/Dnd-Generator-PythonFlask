<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Generator</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  </head>
  <body>
    <header class="app-header">
      <div class="container-xl">
        <h1 class="h4 m-0"><i class="bi bi-dice-5"></i> D&amp;D Prompt Helper</h1>
      </div>
    </header>

    <main class="container-xl py-3">
      <div class="row g-4">
        <!-- Category cards -->
        <div class="col-lg-8">
          <div id="categories" class="category-columns" aria-live="polite">
            <p class="text-muted" id="loading-categories">
              <span class="spinner-border spinner-border-sm"></span> Loading categories…
            </p>
          </div>
        </div>

        <!-- Result + pins + history -->
        <aside class="col-lg-4">
          <div class="sidebar">
            <section id="result-panel" class="result-panel card shadow-sm" aria-live="polite">
              <div class="card-body">
                <div class="result-meta">
                  <span id="result-crumb" class="result-crumb">No prompt yet</span>
                  <button type="button" class="btn btn-sm btn-link result-collapse d-lg-none" id="result-collapse" aria-label="Collapse result" aria-expanded="true">
                    <i class="bi bi-chevron-down"></i>
                  </button>
                </div>
                <div class="result-scroll">
                  <p id="result-text" class="result-text text-muted">
                    Pick any subcategory to roll a random prompt.
                  </p>
                </div>
                <div class="result-actions">
                  <button type="button" class="btn btn-dark btn-sm" id="btn-reroll" disabled title="Roll again (R)">
                    <i class="bi bi-arrow-repeat"></i> Roll again
                  </button>
                  <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-copy" disabled title="Copy to clipboard">
                    <i class="bi bi-clipboard"></i> <span>Copy</span>
                  </button>
                  <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-pin" disabled title="Pin for later">
                    <i class="bi bi-pin-angle"></i> <span>Pin</span>
                  </button>
                </div>
              </div>
            </section>

            <section class="side-list">
              <h2 class="side-list-title"><i class="bi bi-pin-angle-fill"></i> Pinned</h2>
              <ul id="pinned-list" class="list-unstyled m-0"></ul>
              <p id="pinned-empty" class="side-list-empty">Pin prompts you want to keep for tonight's session.</p>
            </section>

            <section class="side-list">
              <div class="d-flex align-items-center justify-content-between">
                <h2 class="side-list-title"><i class="bi bi-clock-history"></i> Recent rolls</h2>
                <button type="button" class="btn btn-link btn-sm p-0" id="btn-clear-history" hidden>Clear</button>
              </div>
              <ul id="history-list" class="list-unstyled m-0"></ul>
              <p id="history-empty" class="side-list-empty">Your last 10 rolls show up here.</p>
            </section>
          </div>
        </aside>
      </div>
    </main>

    <!-- Entries modal -->
    <div class="modal fade" id="entriesModal" tabindex="-1" aria-labelledby="entriesModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="entriesModalLabel"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <ol id="entriesList" class="entries-list"></ol>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='scripts/app.js') }}"></script>
  </body>
</html>
