<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Prompt Helper</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/cards">
          <i class="bi bi-dice-5" aria-hidden="true"></i>
          <span>D&amp;D Prompt Helper</span>
        </a>
        <form class="search" role="search" id="search-form">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input type="search" id="search-input" placeholder="Search prompts and tables…" aria-label="Search prompts and tables" autocomplete="off">
          <kbd class="search-hint" aria-hidden="true">/</kbd>
        </form>
      </div>
    </header>

    <div class="layout">
      <!-- Category navigation (sidebar on desktop, scrolling chips on mobile) -->
      <nav class="cat-nav" aria-label="Categories">
        <ul id="cat-nav-list" class="cat-nav-list"></ul>
      </nav>

      <!-- Selected category / search results -->
      <main class="content" id="content" aria-live="polite">
        <p class="loading"><span class="spinner-border spinner-border-sm"></span> Unrolling the scrolls…</p>
      </main>

      <!-- Result + pins + history -->
      <aside class="side">
        <section id="result-panel" class="result-panel" aria-live="polite">
          <div class="result-meta">
            <i class="bi bi-dice-5 result-die" id="result-die" aria-hidden="true"></i>
            <span id="result-crumb" class="result-crumb">No prompt yet</span>
            <button type="button" class="result-collapse" id="result-collapse" aria-label="Collapse result" aria-expanded="true">
              <i class="bi bi-chevron-down"></i>
            </button>
          </div>
          <div class="result-scroll">
            <p id="result-text" class="result-text is-empty">
              Pick a table and roll for a random prompt.
            </p>
          </div>
          <div class="result-actions">
            <button type="button" class="btn-ink" id="btn-reroll" disabled title="Roll again (R)">
              <i class="bi bi-arrow-repeat"></i> Roll again
            </button>
            <button type="button" class="btn-ink-outline" id="btn-copy" disabled title="Copy to clipboard">
              <i class="bi bi-clipboard"></i> <span>Copy</span>
            </button>
            <button type="button" class="btn-ink-outline" id="btn-pin" disabled title="Pin for later">
              <i class="bi bi-pin-angle"></i> <span>Pin</span>
            </button>
          </div>
        </section>

        <section class="side-list">
          <h2 class="side-list-title"><i class="bi bi-pin-angle-fill"></i> Pinned</h2>
          <ul id="pinned-list" class="list-unstyled m-0"></ul>
          <p id="pinned-empty" class="side-list-empty">Pin prompts you want to keep for tonight's session.</p>
        </section>

        <section class="side-list">
          <div class="side-list-head">
            <h2 class="side-list-title"><i class="bi bi-clock-history"></i> Recent rolls</h2>
            <button type="button" class="link-btn" id="btn-clear-history" hidden>Clear</button>
          </div>
          <ul id="history-list" class="list-unstyled m-0"></ul>
          <p id="history-empty" class="side-list-empty">Your last 10 rolls show up here.</p>
        </section>
      </aside>
    </div>

    <!-- Entries modal -->
    <div class="modal fade" id="entriesModal" tabindex="-1" aria-labelledby="entriesModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div class="flex-grow-1">
              <div class="modal-kicker" id="entriesModalKicker"></div>
              <h5 class="modal-title" id="entriesModalLabel"></h5>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-filter">
            <i class="bi bi-funnel" aria-hidden="true"></i>
            <input type="search" id="entriesFilter" placeholder="Filter this table…" aria-label="Filter entries" autocomplete="off">
            <span id="entriesCount" class="entries-count"></span>
          </div>
          <div class="modal-body">
            <ol id="entriesList" class="entries-list"></ol>
          </div>
        </div>
      </div>
    </div>

    <div class="copy-toast" id="copy-toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='scripts/app.js') }}"></script>
  </body>
</html>
